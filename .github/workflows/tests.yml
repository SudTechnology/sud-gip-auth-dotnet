name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Sud.Gip.Auth.sln -c Release
      - run: dotnet run --project tests/SdkTests -c Release --no-build
      - run: dotnet pack src/Sud.Gip.Auth -c Release --no-build -o artifacts
